# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Re-grouped 2026-09-04 (dependency consolidation campaign): one grouped PR
  # a month instead of five ungrouped weekly ones.
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint's own latest (8.69.0 as of 2026-09-04) caps its
      # typescript peer at "<6.1.0" — the whole ecosystem hasn't caught up to
      # TypeScript 7 (a native Go-based rewrite, not just another major) yet.
      # See docs/reports/2026-09-03-dependency-consolidation.md in the
      # Fabulous repo. Move when @typescript-eslint/parser widens its peer
      # range to include 6.1+/7.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
