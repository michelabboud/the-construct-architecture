contract:
  id: "qa-check-001"
  version: "1.0.0"
  type: "validation"
  name: "QA Quality Check"

  metadata:
    created_at: "2025-01-01T00:00:00Z"
    created_by: "website-builder"
    priority: "high"
    tags: ["qa", "validation", "quality"]

  requirements:
    description: "Run quality assurance checks on all generated website files"

  goals:
    description: "Validate the complete website meets all quality gates"
    objectives:
      - "Verify all pages are valid HTML5"
      - "Verify CSS is syntactically correct"
      - "Check all internal links resolve"
      - "Verify responsive design breakpoints"
      - "Check overall consistency across pages"
    quality_criteria:
      accuracy:
        weight: 0.4
        min_score: 8
      completeness:
        weight: 0.4
        min_score: 8
      consistency:
        weight: 0.2
        min_score: 7
    success_threshold: 8

  limitations:
    constraints:
      - "Must check every generated file"
      - "Must produce a pass/fail report"
      - "Failed checks must include remediation steps"

  limits:
    cost:
      max_usd: 0.15
      warn_at: 0.10
    tokens:
      max_input: 10000
      max_output: 3000
    retries:
      max_attempts: 2
      backoff: "none"
