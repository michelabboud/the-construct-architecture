contract:
  id: "generate-page-001"
  version: "1.0.0"
  type: "generation"
  name: "Generate HTML Page"

  metadata:
    created_at: "2025-01-01T00:00:00Z"
    created_by: "website-builder"
    priority: "high"
    tags: ["html", "page", "generation"]

  requirements:
    description: "Generate a complete HTML page with semantic markup"
    deliverables:
      - type: "html"
        format: "html5"
        save_to: "output/{{pageName}}.html"

  goals:
    description: "Create a well-structured, accessible HTML page"
    objectives:
      - "Use semantic HTML5 elements (header, main, nav, footer)"
      - "Include proper meta tags and title"
      - "Ensure accessibility with ARIA attributes where needed"
      - "Link to the generated stylesheet"
    quality_criteria:
      accuracy:
        weight: 0.3
        min_score: 7
      completeness:
        weight: 0.4
        min_score: 7
      consistency:
        weight: 0.3
        min_score: 6
    success_threshold: 7

  limitations:
    forbidden_actions:
      - "inline_styles"
      - "inline_scripts"
    forbidden_content:
      - "javascript:void"
      - "eval("
      - "document.write"
    constraints:
      - "Must be valid HTML5"
      - "No inline CSS — use external stylesheet"
      - "No inline JavaScript — use external scripts"
      - "Must pass WCAG 2.1 AA accessibility basics"

  limits:
    cost:
      max_usd: 0.25
      warn_at: 0.15
    tokens:
      max_input: 4000
      max_output: 4000
    retries:
      max_attempts: 3
      backoff: "linear"
