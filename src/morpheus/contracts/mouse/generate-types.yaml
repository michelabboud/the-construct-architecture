# Mouse Contract: Generate TypeScript Types
# "Digital pimp, hard at work." — Tank (about Mouse)

contract:
  id: morpheus/mouse/generate-types
  version: "1.0.0"
  type: generation
  name: Generate TypeScript Types

  metadata:
    created_at: "2026-01-24"
    created_by: morpheus
    priority: normal
    tags:
      - morpheus
      - mouse
      - generation
      - typescript
      - types

  requirements:
    description: |
      Generate TypeScript type definitions for contracts.
      Creates Zod schemas, inferred types, and contract executor interfaces.

    tools:
      must_use:
        - tool: template-engine
          reason: "Expand type templates"
        - tool: typescript-generator
          reason: "Generate valid TypeScript code"

  goals:
    description: |
      Generate type-safe TypeScript definitions for Construct contracts
    objectives:
      - Generate Zod input schemas from contract requirements
      - Generate Zod output schemas from contract goals
      - Create inferred TypeScript types from schemas
      - Generate contract executor interface
      - Include proper imports and exports
      - Add documentation comments
    quality_criteria:
      type_safety:
        weight: 0.5
        min_score: 9
      completeness:
        weight: 0.3
        min_score: 8
      usability:
        weight: 0.2
        min_score: 8
    success_threshold: 8.5

  limitations:
    forbidden_actions:
      - Generate types with 'any' keyword
      - Skip validation schemas
      - Create overly complex type hierarchies
    constraints:
      - All types must use Zod for runtime validation
      - Must generate both schemas and inferred types
      - Must include proper TypeScript strict mode compatibility

  freedom:
    decisions:
      - area: type-inference
        description: How to infer types from contract variables
        constraints:
          - Default to string for unknown types
          - Use most specific type when possible
      - area: schema-structure
        description: How to structure Zod schemas
        constraints:
          - Keep schemas flat when possible
          - Use z.object for complex types

  limits:
    time:
      max_duration_ms: 5000
      warn_at_ms: 2500
    retries:
      max_attempts: 2
      backoff: none
