# Tank Contract: Index AI Usage
# "I know everything. I just don't have time to explain it all." — Tank

contract:
  id: morpheus/tank/index-ai-usage
  version: "1.0.0"
  type: analysis
  name: Index AI Usage Patterns

  metadata:
    created_at: "2026-01-24"
    created_by: morpheus
    priority: high
    tags:
      - morpheus
      - tank
      - ai-detection
      - indexing

  requirements:
    description: |
      Analyze scanned files to identify and index all AI usage patterns.
      Detects OpenAI, Anthropic, Google, LangChain, and other AI SDK usage.

    tools:
      must_use:
        - tool: pattern-matcher
          reason: "Match AI usage patterns in code"

  goals:
    description: |
      Build comprehensive index of AI usage in the project
    objectives:
      - Identify all AI SDK imports (openai, anthropic, langchain, etc.)
      - Detect AI API call patterns
      - Catalog prompt templates and system prompts
      - Map tool/function calling usage
      - Identify embedding operations
      - Detect streaming patterns
      - Find configuration for AI providers
    quality_criteria:
      detection_rate:
        weight: 0.5
        min_score: 9
      false_positive_rate:
        weight: 0.3
        min_score: 8
      completeness:
        weight: 0.2
        min_score: 8
    success_threshold: 8.5

  limitations:
    forbidden_actions:
      - Execute any detected AI calls
      - Store API keys or secrets
      - Modify source code
    constraints:
      - Only analyze files from the scan results
      - Report locations, not actual secret values
      - Handle malformed code gracefully

  freedom:
    decisions:
      - area: pattern-priority
        description: Prioritize which patterns to report first
        constraints:
          - Direct SDK usage highest priority
          - Framework usage (LangChain) second
          - Indirect patterns third
      - area: confidence-threshold
        description: Minimum confidence for pattern detection
        constraints:
          - Default threshold 0.7
          - Higher for critical detections

  limits:
    time:
      max_duration_ms: 30000
      warn_at_ms: 15000
    retries:
      max_attempts: 2
      backoff: linear
