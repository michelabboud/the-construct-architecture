# Switch Contract: Audit Changes
# "Not like this." — Switch

contract:
  id: morpheus/switch/audit-changes
  version: "1.0.0"
  type: audit
  name: Audit Code Changes

  metadata:
    created_at: "2026-01-24"
    created_by: morpheus
    priority: high
    tags:
      - morpheus
      - switch
      - audit
      - changes

  requirements:
    description: |
      Audit code changes for security and quality issues.
      Reviews all modifications before they're applied.

    tools:
      must_use:
        - tool: change-analyzer
          reason: "Analyze code changes"
        - tool: security-scanner
          reason: "Scan for security issues"
        - tool: quality-checker
          reason: "Check code quality"

  goals:
    description: |
      Audit all code changes for issues
    objectives:
      - Track change types (create/modify/delete)
      - Flag sensitive file changes
      - Detect security issues in content
      - Check for debug code
      - Identify TODO/FIXME comments
      - Flag disabled tests
      - Calculate risk score
      - Provide recommendation (approve/review/reject)
    quality_criteria:
      thoroughness:
        weight: 0.4
        min_score: 9
      security_focus:
        weight: 0.4
        min_score: 9
      actionability:
        weight: 0.2
        min_score: 8
    success_threshold: 8.5

  limitations:
    forbidden_actions:
      - Apply changes
      - Delete files
      - Execute code
    constraints:
      - Must audit all changes
      - Must flag security issues
      - Must provide remediation suggestions

  freedom:
    decisions:
      - area: severity-classification
        description: How to classify finding severity
        constraints:
          - Security issues = high
          - Quality issues = low/medium
          - Informational = info
      - area: recommendation
        description: When to recommend review vs reject
        constraints:
          - Any high severity = review
          - Multiple high severity = reject
          - High risk score = reject

  limits:
    time:
      max_duration_ms: 60000
      warn_at_ms: 30000
    retries:
      max_attempts: 2
      backoff: none
