# Switch Contract: Validate Contract
# "Not like this." — Switch

contract:
  id: morpheus/switch/validate-contract
  version: "1.0.0"
  type: validation
  name: Validate Contract

  metadata:
    created_at: "2026-01-24"
    created_by: morpheus
    priority: high
    tags:
      - morpheus
      - switch
      - validation
      - contract

  requirements:
    description: |
      Validate generated contracts for correctness and completeness.
      Ensures contracts follow schema rules and best practices.

    tools:
      must_use:
        - tool: schema-validator
          reason: "Validate contract schema"
        - tool: pattern-checker
          reason: "Check for anti-patterns"

  goals:
    description: |
      Validate contract structure, schema, and quality
    objectives:
      - Verify required fields are present
      - Validate field formats (ID, version)
      - Check contract type is valid
      - Verify objectives are defined
      - Check constraints exist
      - Validate quality criteria
      - Detect anti-patterns
    quality_criteria:
      accuracy:
        weight: 0.5
        min_score: 9
      completeness:
        weight: 0.3
        min_score: 8
      strictness:
        weight: 0.2
        min_score: 8
    success_threshold: 8.5

  limitations:
    forbidden_actions:
      - Modify contracts
      - Skip validation steps
      - Auto-approve without checks
    constraints:
      - All errors must be reported
      - Warnings should be noted
      - Scores must be calculated

  freedom:
    decisions:
      - area: severity-assignment
        description: How to assign error vs warning
        constraints:
          - Required fields = error
          - Recommended fields = warning
      - area: scoring
        description: How to calculate scores
        constraints:
          - Start at 100, deduct for issues
          - Minimum score is 0

  limits:
    time:
      max_duration_ms: 5000
      warn_at_ms: 2000
    retries:
      max_attempts: 1
      backoff: none
